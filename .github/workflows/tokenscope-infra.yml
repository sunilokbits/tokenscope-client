# TokenScope infrastructure (Bicep) — applies infra/main.bicep with the
# environment's parameter file. Every secret and setting comes from the
# GitHub environment (dev / uat / prod); Azure sign-in is OIDC, no secret.
name: TokenScope infra

on:
  workflow_dispatch:
    inputs:
      environment:
        description: GitHub environment (dev, uat, prod)
        type: choice
        options: [dev, uat, prod]
        default: dev
      mode:
        description: what-if previews only; apply deploys
        type: choice
        options: [what-if, apply]
        default: what-if
  workflow_call:
    inputs:
      environment:
        type: string
        required: true
      mode:
        type: string
        default: what-if

permissions:
  id-token: write
  contents: read

# Shared with the deploy workflow: an apply resets the app to `latest`.
concurrency:
  group: tokenscope-${{ inputs.environment }}
  cancel-in-progress: false

jobs:
  infra:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    env:
      RG: ${{ vars.AZURE_RESOURCE_GROUP }}
      PARAMS: ${{ vars.TOKENSCOPE_PARAMS }}
      # Non-secret settings read by the parameter files.
      ORG_NAME: ${{ vars.ORG_NAME }}
      APP_PUBLIC_ORIGIN: ${{ vars.APP_PUBLIC_ORIGIN }}
      ENTRA_TENANT_ID: ${{ vars.ENTRA_TENANT_ID }}
      ENTRA_CLIENT_ID: ${{ vars.ENTRA_CLIENT_ID }}
      ENTRA_REDIRECT_URI: ${{ vars.ENTRA_REDIRECT_URI }}
      BOOTSTRAP_ADMIN_EMAIL: ${{ vars.BOOTSTRAP_ADMIN_EMAIL }}
      ALERT_NOTIFICATION_EMAIL: ${{ vars.ALERT_NOTIFICATION_EMAIL }}
      WORKER_BASE_URL: ${{ vars.WORKER_BASE_URL }}
      # Secrets.
      PG_ADMIN_LOGIN: ${{ secrets.PG_ADMIN_LOGIN }}
      PG_ADMIN_PASSWORD: ${{ secrets.PG_ADMIN_PASSWORD }}
      SESSION_SECRET: ${{ secrets.SESSION_SECRET }}
      HMAC_SESSION_KEY: ${{ secrets.HMAC_SESSION_KEY }}
      INTERNAL_WORKER_HMAC_KEY: ${{ secrets.INTERNAL_WORKER_HMAC_KEY }}
      OIDC_SESSION_SECRET: ${{ secrets.OIDC_SESSION_SECRET }}
      OIDC_AUTH_SESSION_SECRET: ${{ secrets.OIDC_AUTH_SESSION_SECRET }}
      OIDC_TOKEN_KEY: ${{ secrets.OIDC_TOKEN_KEY }}
      ENTRA_CLIENT_SECRET: ${{ secrets.ENTRA_CLIENT_SECRET }}
      ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
      OPS_ALERT_NTFY_URL: ${{ secrets.OPS_ALERT_NTFY_URL }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Check configuration
        env:
          ENVIRONMENT: ${{ inputs.environment }}
          AZURE_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
        run: |
          missing=""
          for v in AZURE_CLIENT_ID AZURE_TENANT_ID AZURE_SUBSCRIPTION_ID RG PARAMS \
                   PG_ADMIN_LOGIN PG_ADMIN_PASSWORD SESSION_SECRET HMAC_SESSION_KEY \
                   INTERNAL_WORKER_HMAC_KEY OIDC_SESSION_SECRET OIDC_AUTH_SESSION_SECRET \
                   OIDC_TOKEN_KEY; do
            [ -n "$(printenv "$v")" ] || missing="$missing $v"
          done
          if [ -n "$missing" ]; then
            echo "::error::Not set in the '$ENVIRONMENT' environment:$missing"
            exit 1
          fi
          [ -f "$PARAMS" ] || { echo "::error::Parameter file $PARAMS is not in the repository"; exit 1; }

      - uses: azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Compile parameters
        run: az bicep build-params --file "$PARAMS" --stdout > /dev/null

      - name: What-if
        run: |
          az deployment group what-if --resource-group "$RG" \
            --template-file infra/main.bicep --parameters "$PARAMS" \
            --result-format ResourceIdOnly

      - name: Apply
        if: inputs.mode == 'apply'
        run: |
          az deployment group create --resource-group "$RG" --name main \
            --template-file infra/main.bicep --parameters "$PARAMS" --no-wait
          rc=0
          bash infra/scripts/approve-front-door-private-link.sh "$RG" || rc=$?
          if [ "$rc" = 3 ]; then
            echo "::notice::First apply: the Container App waits for its image. The deploy job builds it; the next infra apply creates what depends on the app."
            exit 0
          fi
          [ "$rc" = 0 ] || exit "$rc"
          echo "::notice::containerAppUrl = $(az deployment group show -g "$RG" -n main \
            --query properties.outputs.containerAppUrl.value -o tsv)"
